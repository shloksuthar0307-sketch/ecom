{% extends 'base.html' %}

{% block title %}Login | AEON{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; padding-top: 100px; padding-bottom: 100px;">
    <div style="background: #fff; padding: 2rem; border-radius: var(--radius-md); box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
        <h1 style="margin-bottom: 1.5rem; text-align: center;">Login</h1>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div style="color: red; margin-bottom: 1rem;">
                    Invalid email or password.
                </div>
            {% endif %}
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email</label>
                <input type="text" name="username" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);" required>
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Password</label>
                <input type="password" name="password" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
