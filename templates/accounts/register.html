{% extends 'base.html' %}

{% block title %}Register | AEON{% endblock %}

{% block content %}
<div class="container section">
    <div style="max-width: 400px; margin: 0 auto; background: var(--bg-secondary); padding: 2rem; border-radius: var(--radius-lg);">
        <h2 style="text-align: center; margin-bottom: 2rem;">Create an Account</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            Already have an account? <a href="{% url 'login' %}">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
