{% extends 'base.html' %}

{% block title %}Complete Payment | AEON{% endblock %}

{% block content %}
<div class="container section">
    <div style="max-width: 500px; margin: 0 auto; text-align: center; background: var(--bg-secondary); padding: 3rem; border-radius: var(--radius-lg);">
        <h2 style="margin-bottom: 1rem;">Complete Your Order</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Order #{{ order.order_number }} for ${{ order.total }}</p>
        
        <form action="{% url 'payment_verify' %}" method="POST" id="razorpay-form">
            {% csrf_token %}
            <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
            <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
            <input type="hidden" name="razorpay_signature" id="razorpay_signature">
        </form>
        
        <button id="rzp-button1" class="btn btn-primary btn-large" style="width: 100%;">Pay Securely with Razorpay</button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ razorpay_key_id }}",
    "amount": "{{ amount }}",
    "currency": "INR",
    "name": "AEON Premium",
    "description": "Order #{{ order.order_number }}",
    "order_id": "{{ razorpay_order_id }}",
    "handler": function (response){
        document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
        document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
        document.getElementById('razorpay_signature').value = response.razorpay_signature;
        document.getElementById('razorpay-form').submit();
    },
    "prefill": {
        "email": "{{ request.user.email }}",
        "contact": "{{ order.shipping_address.phone }}"
    },
    "theme": {
        "color": "#111111"
    }
};
var rzp1 = new Razorpay(options);
document.getElementById('rzp-button1').onclick = function(e){
    rzp1.open();
    e.preventDefault();
}
</script>
{% endblock %}
