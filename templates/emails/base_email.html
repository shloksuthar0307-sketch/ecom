<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ subject }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #111; background-color: #f9f9f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 8px; border: 1px solid #eee; }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: -0.05em; margin-bottom: 30px; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #111; color: #fff; text-decoration: none; border-radius: 4px; font-weight: 500; margin: 20px 0; }
        .footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">AEON</div>
        
        {% block content %}{% endblock %}
        
        <div class="footer">
            &copy; {% now "Y" %} AEON. All rights reserved.<br>
            If you have any questions, please contact support@aeon.com
        </div>
    </div>
</body>
</html>
