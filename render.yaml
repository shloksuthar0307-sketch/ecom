databases:
  - name: aeon-db
    databaseName: aeon
    user: aeon_user
    plan: free

services:
  - type: web
    name: aeon-ecommerce
    env: python
    buildCommand: "bash build.sh"
    # Using Uvicorn because this project uses Django Channels WebSockets
    startCommand: "uvicorn ecommerce.asgi:application --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aeon-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: RENDER
        value: 1
